<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultimate Trance Gate · Black Rage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9C9C9C}a:hover{color:#FF3B3B}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1040px; height: 640px; box-sizing: border-box; background: #000000; color: #F2F2F2; font-family: 'Space Mono', ui-monospace, monospace; padding: 22px 28px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

  <!-- Top -->
  <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 44px; border-bottom: 1px solid #262626; padding-bottom: 10px">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <span style="font-family: 'Anton', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 0.01em">ULTIMATE TRANCE GATE</span>
      <a href="https://www.instagram.com/mikita_laurenau/" style="font-size: 11px; text-decoration: none">by mikita_laurenau ↗</a>
    </div>
    <div style="display: flex; gap: 2px">
      <sc-for list="{{slots}}" as="sl" hint-placeholder-count="8">
        <button style="width: 36px; height: 36px; border: none; border-radius: 0; background: {{sl.bg}}; color: {{sl.fg}}; font-family: 'Anton', sans-serif; font-size: 18px; padding: 0">{{sl.letter}}</button>
      </sc-for>
    </div>
  </div>

  <!-- Preset -->
  <div style="display: flex; align-items: center; gap: 16px; height: 64px">
    <button aria-label="Previous preset" style="width: 40px; height: 40px; border: 1px solid #3A3A3A; background: #000; color: #F2F2F2; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="flex: 1; display: flex; align-items: baseline; gap: 14px; min-width: 0">
      <span style="font-size: 12px; font-weight: 700; color: #000; background: {{red}}; padding: 3px 8px; letter-spacing: 0.1em">RAGE</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 52px; line-height: 1; letter-spacing: 0.01em; white-space: nowrap">SUPERSAW STUTTER</span>
    </div>
    <span style="font-size: 12px; color: #9C9C9C; text-align: right; line-height: 1.5">16 STEPS<br>1/16 · 160 BPM</span>
    <button aria-label="Next preset" style="width: 40px; height: 40px; border: 1px solid #3A3A3A; background: #000; color: #F2F2F2; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>

  <!-- Grid -->
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 6px; height: 160px; align-items: flex-end">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="16">
        <div style="flex: 1; height: 100%; display: flex; align-items: flex-end; background: {{s.bg}}">
          <sc-if value="{{s.on}}" hint-placeholder-val="{{true}}">
            <div style="width: 100%; height: {{s.h}}%; display: flex; gap: 2px">
              <sc-for list="{{s.subs}}" as="u" hint-placeholder-count="1">
                <div style="flex: 1; background: {{s.fill}}"></div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 6px; height: 18px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="16">
        <button style="flex: 1; height: 18px; border: none; border-radius: 0; background: #000; color: {{s.rColor}}; font-size: 11px; font-weight: 700; padding: 0">{{s.rLabel}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 6px; height: 12px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="16">
        <div style="flex: 1; font-size: 10px; color: {{s.numColor}}; text-align: left">{{s.num}}</div>
      </sc-for>
    </div>
  </div>

  <!-- Tools -->
  <div style="display: flex; gap: 0; height: 32px; border: 1px solid #3A3A3A">
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="10">
      <button style="flex: 1; border: none; border-right: 1px solid #3A3A3A; border-radius: 0; background: #000; color: #F2F2F2; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 0">{{t}}</button>
    </sc-for>
    <button style="flex: 1.5; border: none; border-radius: 0; background: {{red}}; color: #000; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 0">RANDOM</button>
  </div>

  <!-- Faders -->
  <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px">
    <div style="display: flex; flex-direction: column; justify-content: space-between">
      <sc-for list="{{faders1}}" as="f" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 14px; height: 22px">
          <span style="width: 74px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em">{{f.label}}</span>
          <div style="flex: 1; height: 4px; background: #262626; position: relative" role="img" aria-label="{{f.aria}}">
            <div style="position: absolute; left: 0; top: 0; height: 4px; width: {{f.pct}}%; background: #F2F2F2"></div>
            <div style="position: absolute; top: -7px; left: {{f.pct}}%; margin-left: -2px; width: 4px; height: 18px; background: {{red}}"></div>
          </div>
          <span style="width: 64px; text-align: right; font-size: 12px; color: #9C9C9C">{{f.value}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; justify-content: space-between">
      <sc-for list="{{faders2}}" as="f" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 14px; height: 22px">
          <span style="width: 74px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em">{{f.label}}</span>
          <div style="flex: 1; height: 4px; background: #262626; position: relative" role="img" aria-label="{{f.aria}}">
            <div style="position: absolute; left: 0; top: 0; height: 4px; width: {{f.pct}}%; background: #F2F2F2"></div>
            <div style="position: absolute; top: -7px; left: {{f.pct}}%; margin-left: -2px; width: 4px; height: 18px; background: {{red}}"></div>
          </div>
          <span style="width: 64px; text-align: right; font-size: 12px; color: #9C9C9C">{{f.value}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"red":{"editor":"color","default":"#FF3B3B","options":["#FF3B3B","#B6FF3B","#3BA9FF"]},"$preview":{"width":1040,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const red = this.props.red ?? '#FF3B3B';
    const play = 8;
    // Rage · Supersaw Stutter: 4.2. X.3. 4.2. X.33
    const R = [4, 0, 2, 0, 1, 0, 3, 0, 4, 0, 2, 0, 1, 0, 3, 3];
    const L = [1, 0, 1, 0, 0.7, 0, 1, 0, 1, 0, 1, 0, 0.7, 0, 1, 0.85];
    const steps = R.map((r, i) => {
      const on = L[i] > 0;
      return {
        on,
        h: Math.round(L[i] * 100),
        subs: Array.from({ length: Math.max(1, r) }, (_, k) => k),
        fill: i === play ? red : '#F2F2F2',
        bg: i === play ? '#1A0606' : '#0D0D0D',
        rLabel: r > 1 ? 'x' + r : '·',
        rColor: r > 1 ? red : '#3A3A3A',
        num: String(i + 1).padStart(2, '0'),
        numColor: i % 4 === 0 ? '#F2F2F2' : '#6B6B6B'
      };
    });
    const active = 5;
    const slots = 'ABCDEFGH'.split('').map((letter, i) => ({
      letter,
      bg: i === active ? red : '#0D0D0D',
      fg: i === active ? '#000000' : '#9C9C9C'
    }));
    const fader = (label, f, value) => ({ label, value, pct: Math.round(f * 100), aria: label + ' ' + value });
    return {
      red,
      steps,
      slots,
      tools: ['<<', '>>', 'REV', 'INV', 'x2', '/2', 'FILL', 'CLR', 'COPY', 'PASTE'],
      faders1: [
        fader('ATTACK', 0.08, '0.5 MS'), fader('DECAY', 0.45, '150 MS'), fader('SUSTAIN', 1, '100 %'),
        fader('RELEASE', 0.18, '15 MS'), fader('GATE', 0.7, '70 %')
      ],
      faders2: [
        fader('SWING', 0, '0 %'), fader('DEPTH', 1, '100 %'), fader('STEREO', 0.25, '2 ST'),
        fader('MIX', 1, '100 %'), fader('EUCLID', 0.31, '5 / 16')
      ]
    };
  }
}
</script>
</body>
</html>
